# 品质门 CI:本项目无单元测试框架,引擎正确性靠 scripts/demo.ts 的运行时断言保证。
# push / PR 时自动跑三断言(唯一解 + 逻辑可解 + 解一致)+ 验证 SSG 构建。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # demo.ts 用 node 原生跑 .ts(type stripping),需 Node 23+
      - run: npm ci
      - name: 验证精确候选 SHA（余量、类型、引擎、测量合同、完整构建）
        run: bash scripts/check-release-candidate.sh "$GITHUB_SHA"
