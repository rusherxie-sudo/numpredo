# 每日生成 sitemap-lastmod.json + published.json，并确保 main 获得一个新 commit。
# 即使派生数据未变化，也要用空 commit 触发 CF Pages 每日 build + deploy；
# /daily/ 的滚动题目窗口与 /daily/archive/ 的昨日上限都依赖构建日期。
# 无需 GitHub Secrets：GITHUB_TOKEN 由 Actions 自动注入，写权限限定本仓库
name: Daily Data Update

on:
  schedule:
    - cron: '0 16 * * *' # 日本時間 01:00（每天凌晨 UTC 16:00）
  workflow_dispatch: # 支持手动触发

concurrency:
  group: daily-data
  cancel-in-progress: true

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # 取完整 git 历史（gen-sitemap-lastmod.ts 内部会跑 git log 算真实 lastmod）
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      - name: 日替わり題庫の余量検証
        run: npm run check:daily

      - name: 型・Astro コンポーネント検証
        run: npm run check

      - name: 引擎品质断言
        run: npm run demo

      - name: 生成并安全推送日次数据（CF Pages 会自动 build + deploy）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 内容提交可能恰好与定时任务重叠。每次尝试都从最新 main 重新生成派生数据，
          # 不 rebase 可能冲突的生成文件，也不 force push。
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            npm run gen:sitemap
            npm run gen:published
            git add src/data/sitemap-lastmod.json src/data/published.json
            if git diff --staged --quiet; then
              echo "派生数据无变更；创建空提交以触发日替题每日重建"
              git commit --allow-empty -m "chore: 触发日替题每日重建"
            else
              git commit -m "chore: 每日更新日次数据（lastmod + published）"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main 在推送期间更新；重新生成后重试（${attempt}/3）"
          done
          echo "三次安全重试后仍无法推送；保留失败以便排查，未覆盖远端提交。" >&2
          exit 1
